services:
  app:
    image: ghcr.io/lashminarayanan/rag-app:latest
    container_name: financial-rag-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=financial_rag
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_pass
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=qwen3:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - REPORTS_DIR=/app/data/reports
      - PYTHON_QUERY_WORKER=python3
      - RAG_PYTHON_ENTRY=/app/rag/app/query_worker.py
      - RAG_INGEST_WORKER_ENTRY=/app/rag/app/ingest_worker.py
    volumes:
      - /workspace/reports:/app/data/reports
    depends_on:
      - postgres
      - ollama

  postgres:
    image: pgvector/pgvector:pg16
    container_name: financial-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
    ports:
      - "5432:5432"
    volumes:
      - /workspace/postgres/data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d

  ollama:
    image: ollama/ollama:latest
    container_name: financial-rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /workspace/ollama:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_CHAT_MODEL=qwen3:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_FLASH_ATTENTION=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
