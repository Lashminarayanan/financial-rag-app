name: Build & Push Docker Images

on:
  push:
    branches: [runpod-foren]
  workflow_dispatch:

env:
  REPO_NAME: lashminarayanan

jobs:
  build-app-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_NAME }}/rag-app:latest
            ghcr.io/${{ env.REPO_NAME }}/rag-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-runpod-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RunPod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runpod
          push: true
          tags: |
            ghcr.io/${{ env.REPO_NAME }}/rag-app-runpod-foren:latest
            ghcr.io/${{ env.REPO_NAME }}/rag-app-runpod-foren:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
